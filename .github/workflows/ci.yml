name: CI

on:
  push:
    branches: [ master ]
    tags: ['[0-9]+.[0-9]+.*']
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['lts/-2', 'lts/-1', 'lts/*']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning] zizmorcore/zizmor#2496
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run check
      - run: npm run test

  analyze_ci:
    name: Static analysis (GitHub Actions)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        persona: pedantic
        advanced-security: false # Fail the GitHub action if Zizmor has findings

  release:
    name: Release
    needs: [test, analyze_ci]
    if: github.ref_type == 'tag' && github.event.repository.fork == false
    permissions:
      contents: read

    # Self-repository syntax is not supported by the outdated Zizmor version
    # used by Google's cross-repo tooling.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
